name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Not an optional extra. We develop cloud-first with no local Docker
  # (docs/decisions/0013), so this job is the ONLY place the pgTAP suite runs —
  # including the sweep that fails on any table without a policy. An RLS gap is a
  # silent cross-tenant data leak, and this is the control that catches it.
  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # Replays every migration from an empty database. This is also the
      # reset-and-replay loop we gave up locally: it is how a migration ordering
      # bug gets caught.
      - name: Start local stack
        run: supabase start

      - name: Database tests
        run: supabase test db

      - name: Diagnostics on failure
        if: failure()
        run: supabase status && supabase db lint
