  # database:
  #   name: Migrations and RLS
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: supabase/setup-cli@v1
  #     - run: supabase start
  #     - run: supabase test db
