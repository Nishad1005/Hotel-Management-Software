name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # Not an optional extra. We develop cloud-first with no local Docker
  # (docs/decisions/0013), so this job is the ONLY place the pgTAP suite runs —
  # including the sweep that fails on any table without a policy. An RLS gap is a
  # silent cross-tenant data leak, and this is the control that catches it.
  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # Replays every migration from an empty database. This is also the
      # reset-and-replay loop we gave up locally: it is how a migration ordering
      # bug gets caught.
      - name: Start local stack
        run: supabase start

      - name: Database tests
        run: supabase test db

      # Generated from the replayed migrations, not from the live project, so no
      # access token or database password is needed anywhere in CI — and the
      # committed types are provably a function of the migrations rather than of
      # whatever was last changed by hand in the dashboard.
      - name: Types match the schema
        run: |
          mkdir -p packages/db/src
          supabase gen types typescript --local > /tmp/types.ts
          if [ -f packages/db/src/types.ts ] && ! diff -q /tmp/types.ts packages/db/src/types.ts; then
            echo "::error::Generated types drift from the schema. Run the generator and commit the result."
            diff /tmp/types.ts packages/db/src/types.ts || true
            exit 1
          fi

      - name: Diagnostics on failure
        if: failure()
        run: supabase status && supabase db lint

  # Applies migrations to the production database.
  #
  # `needs` is the whole point of this job existing. Supabase's own "Deploy to
  # production" toggle applies migrations on merge regardless of whether CI passed;
  # it is deliberately left OFF so that this gate is the only path in. Never make
  # this job independent of the test jobs to unblock a release.
  # See docs/decisions/0013-cloud-first-development.md.
  deploy:
    name: Apply migrations to production
    needs: [verify, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub environment to make production
    # migrations a manual approval rather than an automatic one.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dwnuxeeglkpsssissmuu
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show what will be applied
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push
