name: CI

# Every push on every branch, not just main and pull requests.
#
# The narrower version let four commits land on a feature branch with no CI at all,
# because no pull request had been opened yet — and the last verified commit on that
# branch was red. Work should be verified when it is pushed, not when someone
# remembers to open a PR.
#
# `pull_request` is deliberately absent: in a single-repository workflow it only
# duplicates the push run. Add it back if outside forks ever contribute.
on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without this the GITHUB_TOKEN inherits the repository default,
# which is frequently read/write - more than any job here needs.
permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Bundling is a SEPARATE guarantee from typechecking. A ".js" extension on a
      # relative import inside packages/domain typechecked cleanly and passed all 23
      # tests, then failed to bundle, because Metro does not rewrite ".js" to ".ts"
      # the way tsc does. Green types and green tests are not evidence the app can
      # ship. This step is that evidence.
      - name: Build
        run: pnpm build

  # Not an optional extra. We develop cloud-first with no local Docker
  # (docs/decisions/0013), so this job is the ONLY place the pgTAP suite runs —
  # including the sweep that fails on any table without a policy. An RLS gap is a
  # silent cross-tenant data leak, and this is the control that catches it.
  database:
    name: Migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      # Replays every migration from an empty database. This is also the
      # reset-and-replay loop we gave up locally: it is how a migration ordering
      # bug gets caught.
      - name: Start local stack
        run: supabase start

      - name: Database tests
        run: |
          set -o pipefail
          supabase test db 2>&1 | tee "$RUNNER_TEMP/dbtest.txt"

      # Raw job logs need authentication to download, even on a public repository.
      # Check-run annotations do not. Echoing the pgTAP failures as ::error::
      # therefore makes a red build diagnosable from the API alone, instead of
      # requiring someone to open the browser and copy the log out.
      - name: Surface pgTAP failures as annotations
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/dbtest.txt" ]; then
            grep -E "not ok|# Failed|# Looks like|ERROR:|psql:|DETAIL:|HINT:|CONTEXT:" \
              "$RUNNER_TEMP/dbtest.txt" | head -40 | while IFS= read -r line; do
                echo "::error::${line}"
              done
          fi

      # packages/db/src/types.ts is hand-maintained, because generation cannot be
      # bootstrapped from a machine without Docker or a database password. A
      # byte-exact diff against the generator would therefore be permanently red,
      # and a permanently red check gets disabled - which is worse than no check.
      #
      # So this compares the SET OF TABLES instead. That catches the failure that
      # actually happens: a migration adds a table and the types forget it. A
      # missing file fails here too, which was the specific defect in the earlier
      # version of this step.
      - name: Types cover the schema
        run: |
          if [ ! -f packages/db/src/types.ts ]; then
            echo "::error::packages/db/src/types.ts is missing."
            exit 1
          fi
          supabase gen types typescript --local > "$RUNNER_TEMP/generated-types.ts"
          node scripts/check-db-types.mjs "$RUNNER_TEMP/generated-types.ts" packages/db/src/types.ts

      - name: Diagnostics on failure
        if: failure()
        run: supabase status && supabase db lint

  # Applies migrations to the production database.
  #
  # `needs` is the whole point of this job existing. Supabase's own "Deploy to
  # production" toggle applies migrations on merge regardless of whether CI passed;
  # it is deliberately left OFF so that this gate is the only path in. Never make
  # this job independent of the test jobs to unblock a release.
  # See docs/decisions/0013-cloud-first-development.md.
  deploy:
    name: Apply migrations to production
    needs: [verify, database]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Add required reviewers to this GitHub environment to make production
    # migrations a manual approval rather than an automatic one.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: dwnuxeeglkpsssissmuu
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show what will be applied
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push
